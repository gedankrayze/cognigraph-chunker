[package]
name = "cognigraph-python"
version = "2.2.3"
edition = "2024"
# Distributed via PyPI (maturin), never crates.io
publish = false

[lib]
name = "cognigraph_chunker"
crate-type = ["cdylib"]

[dependencies]
cognigraph-chunker = { path = "../.." }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.29"
tokio = { version = "1.51", features = ["rt-multi-thread"] }
anyhow = "1.0"
serde_json = "1.0"
