name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Toolchain (channel + rustfmt/clippy components) comes from
      # rust-toolchain.toml — rustup installs it on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  python:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
      - name: Build and test Python bindings
        # Build a wheel and install it rather than `maturin develop`, which
        # requires an active virtualenv the runner doesn't provide.
        run: |
          pip install maturin pytest numpy
          maturin build --out dist --manifest-path packages/python/Cargo.toml
          pip install dist/*.whl
          pytest -q tests/python

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - run: docker build .
