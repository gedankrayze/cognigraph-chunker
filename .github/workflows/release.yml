name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── CLI binaries → GitHub Release assets ────────────────────────────
  binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: cognigraph-chunker-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: cognigraph-chunker-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: cognigraph-chunker-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: cognigraph-chunker-darwin-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Channel comes from rust-toolchain.toml; add the cross target to it.
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cross-compilation toolchain for Linux ARM64
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo build --release --target ${{ matrix.target }} --bin cognigraph-chunker

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz cognigraph-chunker
          cd ../../..
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload to release
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            ${{ matrix.artifact }}.tar.gz \
            ${{ matrix.artifact }}.tar.gz.sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Rust crate → crates.io ──────────────────────────────────────────
  # Gated on the wheel/sdist builds so a wheel failure does not publish a
  # crate version that PyPI never receives (which would strand that
  # version and force a yank + bump).
  publish-crate:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Re-running a release whose version is already on crates.io fails
      # loudly, which is the intended behavior.
      - run: cargo publish -p cognigraph-chunker
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── Python wheels → PyPI (abi3: one wheel per platform, Python ≥ 3.9) ─
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux wheels build with zig: the manylinux gcc cross-container
          # can't assemble ring's ARMv8 code, but zig's clang can.
          - os: ubuntu-latest
            target: x86_64
            zig: "--zig"
          - os: ubuntu-latest
            target: aarch64
            zig: "--zig"
          - os: macos-latest
            target: x86_64
            zig: ""
          - os: macos-latest
            target: aarch64
            zig: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist ${{ matrix.zig }} --manifest-path packages/python/Cargo.toml
          target: ${{ matrix.target }}
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path packages/python/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish-pypi:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "wheels-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
